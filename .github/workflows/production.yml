name: Production CI/CD

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Build and test production
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore SMTManagement.slnx

      - name: Build solution
        run: dotnet build SMTManagement.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test SMTManagement.Tests/SMTManagement.Tests.csproj --configuration Release --no-build --no-restore --verbosity normal

  publish-image:
    name: Publish production Docker image
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/production
          tags: type=raw,value=latest

      - name: Build and push production Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
