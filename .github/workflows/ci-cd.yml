name: CI/CD

on:
  pull_request:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore SMTManagement.WebAPI/SMTManagement.WebAPI.csproj

      - name: Build solution
        run: dotnet build SMTManagement.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test SMTManagement.Tests/SMTManagement.Tests.csproj --configuration Release --no-build --no-restore --verbosity normal

      - name: Publish application artifact
        if: github.event_name == 'push'
        run: dotnet publish SMTManagement.WebAPI/SMTManagement.WebAPI.csproj --configuration Release --no-build --no-restore --output ./artifacts/publish

      - name: Upload application artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: smtmanagement-${{ github.sha }}
          path: ./artifacts/publish
          if-no-files-found: error

  release:
    name: Build and publish container
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
